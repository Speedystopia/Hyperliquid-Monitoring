name: Windows build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test C and UI calculations
        shell: cmd
        run: tools\build.cmd
      - name: Package portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item OilPerps.exe -Destination package
      - uses: actions/upload-artifact@v4
        with:
          name: Hyperliquid-Monitoring-Windows-x64
          path: package/
