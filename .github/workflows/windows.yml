name: Windows build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test C and UI calculations
        shell: cmd
        run: build.cmd
      - name: Package portable application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item OilPerps.exe,Lancer.cmd,Installer-demarrage.cmd,Retirer-demarrage.cmd,install-startup.ps1,README.md,LICENSE -Destination package
          Copy-Item web,data -Destination package -Recurse
      - uses: actions/upload-artifact@v4
        with:
          name: Oil-Perps-Hyperliquid-Windows-x64
          path: package/
